# Project Configuration
project:
  name: "ranjit-finance-llm"
  version: "0.1.0"

# Paths
paths:
  raw_data: "data/raw"
  parsed_data: "data/parsed"
  filtered_data: "data/filtered"
  training_data: "data/training"
  base_model: "models/base/phi3-mini"
  adapters: "models/adapters"
  merged_model: "models/merged"

# Data settings
data:
  mbox_file: "All mail Including Spam and Trash-002.mbox"
  max_emails: null  # null = process all
  min_body_length: 50  # Ignore very short emails
  max_body_length: 5000  # Truncate very long emails

# Model settings
model:
  base: "microsoft/Phi-3-mini-4k-instruct"
  quantization: "4bit"

# Training settings
training:
  batch_size: 1
  learning_rate: 1e-5
  lora_layers: 8
  iterations: 500

# Entity extraction targets
entities:
  - amount
  - type  # credit/debit
  - account
  - merchant
  - date
  - category
